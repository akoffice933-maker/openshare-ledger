name: ledger-verify

# Целостность реестра проверяем на каждый push в main.
# Если кто-то изменил историю — пайплайн упадёт здесь.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # demo/repo в .gitignore — на чистом чекауте его нет,
      # поэтому его нужно пересоздать перед проверкой.
      - name: Подготовка состояния
        run: |
          python3 -m ledger init
          python3 -m ledger heldout --file private/golden.jsonl

      - name: Демо-репозиторий (восстановить историю вкладов)
        run: python3 tools/make_demo_repo.py

      # Без score леджер пуст и verify честно сообщает о расхождении
      # «0 в леджере ≠ пересчитано» — проверка должна идти после начисления.
      - name: Начисление
        run: python3 -m ledger score --repo demo/repo --cycle "$(date +%Y-%m)"

      - name: Цепочка и воспроизводимость
        run: python3 -m ledger verify --repo demo/repo --recompute --cycle "$(date +%Y-%m)"

      - name: Гарантии реестра
        run: python3 -m ledger selftest
