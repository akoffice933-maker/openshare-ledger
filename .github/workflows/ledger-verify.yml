name: ledger-verify

# Проверяем целостность опубликованного реестра на каждый push.
#
# Здесь ТОЛЬКО проверка цепочки, без --recompute. Причина: леджер
# начисляется ночным ledger-snapshot, поэтому после любого коммита,
# который даёт вклад (например, правка docs/), леджер на один шаг
# отстаёт от истории — и --recompute честно падает с расхождением.
# Воспроизводимость проверяется там, где леджер пересчитывается:
# в ledger-snapshot.yml.
#
# Демо-сценарий здесь не запускается: он требует приватный
# private/golden.jsonl, которого в CI нет по определению.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Цепочка реестра (неизменность опубликованных записей)
        run: python3 -m ledger verify

      - name: Гарантии реестра
        run: python3 -m ledger selftest
